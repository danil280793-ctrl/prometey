<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аудит МРЦ и Дат</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Используем более стабильную версию SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-8 font-sans text-gray-800">

    <div class="max-w-7xl mx-auto px-4">
        
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900 tracking-tight">Аудит МРЦ 22.08.26</h1>
            <p class="text-gray-500 mt-1">Жесткая проверка: если есть МРЦ, проверка формата даты обязательна.</p>
        </div>

        <div id="statsContainer" class="hidden grid grid-cols-2 md:grid-cols-4 gap-4 mb-8"></div>

        <label id="dropZone" for="fileInput" class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-gray-300 rounded-2xl cursor-pointer hover:bg-white hover:border-blue-400 transition-all duration-200 group bg-white/50 mb-8">
            <svg class="w-8 h-8 mb-2 text-gray-400 group-hover:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
            <p class="text-sm text-gray-500 group-hover:text-blue-600 font-medium">Выберите Excel файл</p>
            <p class="text-xs text-gray-400 mt-1">Поддерживаются .xlsx, .xls</p>
            <input id="fileInput" type="file" class="hidden" accept=".xlsx, .xls" />
        </label>

        <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 pb-10"></div>
    </div>

<script>
// Проверяем, загрузилась ли библиотека
if (typeof XLSX === 'undefined') {
    document.getElementById('dropZone').innerHTML = 
        '<div class="text-red-500 text-center">' +
        '<p class="font-bold">Ошибка загрузки библиотеки</p>' +
        '<p class="text-sm">Пожалуйста, обновите страницу или проверьте интернет-соединение</p>' +
        '</div>';
}

document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    // Проверяем расширение файла
    const fileExtension = file.name.split('.').pop().toLowerCase();
    if (!['xlsx', 'xls'].includes(fileExtension)) {
        alert('Пожалуйста, выберите файл Excel (.xlsx или .xls)');
        return;
    }

    const reader = new FileReader();
    
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            
            // Проверяем, что XLSX загружен
            if (typeof XLSX === 'undefined') {
                alert('Библиотека XLSX не загружена. Пожалуйста, обновите страницу.');
                return;
            }
            
            const workbook = XLSX.read(data, { 
                type: 'array',
                cellDates: false,
                dateNF: 'yyyy-mm-dd'
            });
            
            if (!workbook || !workbook.SheetNames || workbook.SheetNames.length === 0) {
                alert('Файл не содержит листов. Пожалуйста, проверьте файл.');
                return;
            }
            
            const worksheet = workbook.Sheets[workbook.SheetNames[0]];
            
            if (!worksheet) {
                alert('Не удалось прочитать лист. Пожалуйста, проверьте файл.');
                return;
            }
            
            const rows = XLSX.utils.sheet_to_json(worksheet, { 
                header: 1, 
                defval: "",
                blankrows: true
            });
            
            if (!rows || rows.length === 0) {
                alert('Файл пуст или не содержит данных.');
                return;
            }
            
            processExcelData(rows);
            
        } catch (error) {
            console.error('Детали ошибки:', error);
            alert('Ошибка при чтении файла: ' + error.message + '\nПожалуйста, проверьте формат файла.');
        }
    };
    
    reader.onerror = function() {
        alert('Ошибка при чтении файла. Пожалуйста, попробуйте снова.');
    };
    
    reader.readAsArrayBuffer(file);
});

// Поддержка Drag & Drop для Firefox
const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', function(e) {
    e.preventDefault();
    this.classList.add('border-blue-500', 'bg-blue-50');
});

dropZone.addEventListener('dragleave', function(e) {
    e.preventDefault();
    this.classList.remove('border-blue-500', 'bg-blue-50');
});

dropZone.addEventListener('drop', function(e) {
    e.preventDefault();
    this.classList.remove('border-blue-500', 'bg-blue-50');
    
    const files = e.dataTransfer.files;
    if (files.length > 0) {
        const file = files[0];
        const fileInput = document.getElementById('fileInput');
        const dt = new DataTransfer();
        dt.items.add(file);
        fileInput.files = dt.files;
        fileInput.dispatchEvent(new Event('change'));
    }
});

function processExcelData(rows) {
    let groupedData = {};
    let currentENS = null;
    let currentMRP = null;
    let isDateRow = false;
    let colIndexDate = -1;
    let colIndexENS = -1;  

    for (let i = 0; i < rows.length; i++) {
        const cols = rows[i].map(function(c) { 
            return String(c).trim(); 
        });
        
        // Проверка на пустую строку
        let isEmpty = true;
        for (let j = 0; j < cols.length; j++) {
            if (cols[j] !== "") {
                isEmpty = false;
                break;
            }
        }
        if (isEmpty) continue;

        const rowStr = cols.join(' ');

        // Поиск строки с "Отчет по приемке"
        if (rowStr.indexOf("Отчет по приемке") !== -1) {
            currentMRP = null; 
            currentENS = null; 
            isDateRow = false; 
            colIndexDate = -1; 
            colIndexENS = -1;
            
            // Поиск МРЦ
            const mrpMatch = rowStr.match(/МРЦ\s*(\d+)\s*р/i);
            if (mrpMatch && mrpMatch[1]) {
                currentMRP = mrpMatch[1];
            }
        }

        // Поиск колонки "Код ЕНС"
        if (rowStr.indexOf("Код ЕНС") !== -1) {
            for (let j = 0; j < cols.length; j++) {
                if (cols[j] === "Код ЕНС") {
                    colIndexENS = j;
                    break;
                }
            }
        }

        // Проверка на наличие ЕНС
        if (colIndexENS !== -1 && cols[colIndexENS] !== "" && cols[colIndexENS] !== "Код ЕНС") {
            const potentialENS = cols[colIndexENS];
            // Проверка на число или строку с запятой
            if (potentialENS.indexOf(',') !== -1 || /^\d{5}$/.test(potentialENS)) {
                currentENS = potentialENS;
            }
        }

        // Поиск колонки "Дата изготовления"
        if (rowStr.indexOf("Дата изготовления") !== -1) {
            for (let j = 0; j < cols.length; j++) {
                if (cols[j].indexOf("Дата изготовления") !== -1) {
                    colIndexDate = j;
                    break;
                }
            }
            isDateRow = true;
            continue;
        }

        // Обработка дат
        if (isDateRow && colIndexDate !== -1) {
            // Проверка, что строка не пустая
            let isRowEmpty = true;
            for (let j = 0; j < cols.length; j++) {
                if (cols[j] !== "") {
                    isRowEmpty = false;
                    break;
                }
            }
            
            if (isRowEmpty) { 
                isDateRow = false; 
                continue; 
            }

            let dateStr = cols[colIndexDate];
            if (dateStr && dateStr !== '') {
                // Инициализация группы, если её нет
                if (!groupedData[currentENS]) {
                    groupedData[currentENS] = { 
                        mrp: currentMRP, 
                        items: [], 
                        hasError: false 
                    };
                }
                
                // Проверка формата даты
                const fakeDateMatch = dateStr.match(/^(\d{2})\.(\d{2})\.0(\d{3})$/);
                
                // ЖЕЛЕЗНАЯ ЛОГИКА ПРОВЕРКИ
                if (currentMRP) {
                    // Если в шапке ЕСТЬ МРЦ -> Проверка строго обязательна!
                    if (fakeDateMatch) {
                        // Формат верный (01.01.0XXX), проверяем цифры
                        const isValid = fakeDateMatch[3] === currentMRP;
                        if (!isValid) {
                            groupedData[currentENS].hasError = true;
                        }
                        
                        groupedData[currentENS].items.push({
                            date: dateStr, 
                            statusType: isValid ? 'ok' : 'error',
                            text: isValid ? 'ОК' : 'Ошибка (в дате ' + fakeDateMatch[3] + 'р.)'
                        });
                    } else {
                        // Формат НЕверный (например обычная дата 01.01.2026), а МРЦ есть - это ОШИБКА
                        groupedData[currentENS].hasError = true;
                        groupedData[currentENS].items.push({
                            date: dateStr, 
                            statusType: 'error',
                            text: 'Ошибка (ожидался 0' + currentMRP + ')'
                        });
                    }
                } else {
                    // Если в шапке НЕТ МРЦ (например Стики) -> Только пропуск
                    groupedData[currentENS].items.push({ 
                        date: dateStr, 
                        statusType: 'skip', 
                        text: 'Пропуск' 
                    });
                }
            }
        }
    }

    renderResults(groupedData);
}

function renderResults(groupedData) {
    const statsContainer = document.getElementById('statsContainer');
    const cardsContainer = document.getElementById('cardsContainer');
    const dropZone = document.getElementById('dropZone');
    
    dropZone.classList.add('hidden');
    cardsContainer.innerHTML = '';

    let totalItems = 0, okCount = 0, errorCount = 0, skipCount = 0;
    
    // Сортировка ЕНС
    const ensArray = Object.keys(groupedData);
    const sortedENS = ensArray.sort(function(a, b) {
        const aData = groupedData[a];
        const bData = groupedData[b];

        const getPriority = function(data) {
            if (data.hasError) return 0; // Сначала ошибки
            let hasOk = false;
            for (let i = 0; i < data.items.length; i++) {
                if (data.items[i].statusType === 'ok') {
                    hasOk = true;
                    break;
                }
            }
            if (hasOk) return 1; // Потом верные
            return 2; // В конце пропущенные
        };

        const priorityA = getPriority(aData);
        const priorityB = getPriority(bData);

        if (priorityA < priorityB) return -1;
        if (priorityA > priorityB) return 1;
        return 0;
    });

    // Отрисовка карточек
    for (let idx = 0; idx < sortedENS.length; idx++) {
        const ens = sortedENS[idx];
        const data = groupedData[ens];
        
        // Подсчет статистики
        for (let i = 0; i < data.items.length; i++) {
            const item = data.items[i];
            totalItems++;
            if (item.statusType === 'ok') okCount++;
            if (item.statusType === 'error') errorCount++;
            if (item.statusType === 'skip') skipCount++;
        }

        // Проверка наличия OK записей
        let hasOkChecks = false;
        for (let i = 0; i < data.items.length; i++) {
            if (data.items[i].statusType === 'ok') {
                hasOkChecks = true;
                break;
            }
        }

        // ЛОГИКА ЦВЕТОВ КАРТОЧЕК
        let cardStyle = "border-gray-200 bg-gray-50 opacity-60"; 
        let ensTextColor = "text-gray-500";
        let badgeStyle = "bg-gray-100 text-gray-400";

        if (data.hasError) {
            cardStyle = "border-red-300 bg-red-50/30 ring-1 ring-red-200"; 
            ensTextColor = "text-red-700";
            badgeStyle = "bg-red-100 text-red-700";
        } else if (hasOkChecks) {
            cardStyle = "border-green-400 bg-green-50/40 ring-1 ring-green-200"; 
            ensTextColor = "text-green-800";
            badgeStyle = "bg-green-100 text-green-800";
        }

        // ЛОГИКА ЦВЕТОВ СТРОК ВНУТРИ
        let itemsHtml = '';
        for (let i = 0; i < data.items.length; i++) {
            const item = data.items[i];
            if (item.statusType === 'error') {
                itemsHtml += '<div class="flex justify-between items-center bg-red-100 text-red-800 px-2 py-1 rounded text-xs font-bold shadow-sm">' +
                            '<span class="font-mono">' + item.date + '</span>' +
                            '<span>❌ ' + item.text + '</span>' +
                            '</div>';
            } else if (item.statusType === 'ok') {
                let rowBg = data.hasError ? "bg-gray-50 text-gray-500" : "bg-white text-gray-700";
                itemsHtml += '<div class="flex justify-between items-center ' + rowBg + ' px-2 py-1 rounded text-xs">' +
                            '<span class="font-mono">' + item.date + '</span>' +
                            '<span class="text-green-600 font-semibold">✅ ' + item.text + '</span>' +
                            '</div>';
            } else {
                itemsHtml += '<div class="flex justify-between items-center text-gray-300 pl-2 py-0.5 text-xs">' +
                            '<span class="font-mono">' + item.date + '</span>' +
                            '<span>' + item.text + '</span>' +
                            '</div>';
            }
        }

        cardsContainer.innerHTML += 
            '<div class="rounded-xl border-2 ' + cardStyle + ' p-4 shadow-sm hover:shadow-md transition-all flex flex-col">' +
                '<div class="flex justify-between items-start mb-3 pb-2 border-b border-slate-200/50">' +
                    '<div>' +
                        '<p class="text-[10px] uppercase tracking-wider text-gray-400 font-medium">Код ЕНС</p>' +
                        '<p class="text-lg font-bold ' + ensTextColor + ' mt-0.5">' + ens + '</p>' +
                    '</div>' +
                    '<div class="' + badgeStyle + ' text-xs font-bold px-2.5 py-1 rounded-lg">' +
                        (data.mrp ? data.mrp + 'р.' : '—') +
                    '</div>' +
                '</div>' +
                '<div class="flex-1 space-y-1 overflow-y-auto max-h-48 hide-scrollbar">' +
                    itemsHtml +
                '</div>' +
            '</div>';
    }

    // Обновление статистики
    if (totalItems > 0) {
        statsContainer.classList.remove('hidden');
        statsContainer.innerHTML = 
            '<div class="bg-white rounded-xl p-4 border border-gray-200 shadow-sm">' +
                '<p class="text-3xl font-bold text-gray-800">' + Object.keys(groupedData).length + '</p>' +
                '<p class="text-xs text-gray-500 uppercase tracking-wider mt-1">Всего ЕНС</p>' +
            '</div>' +
            '<div class="bg-red-50 rounded-xl p-4 border border-red-200 shadow-sm ' + (errorCount > 0 ? 'ring-2 ring-red-300' : 'opacity-50') + '">' +
                '<p class="text-3xl font-bold text-red-600">' + errorCount + '</p>' +
                '<p class="text-xs text-red-500 uppercase tracking-wider mt-1">❌ Неверно</p>' +
            '</div>' +
            '<div class="bg-green-50 rounded-xl p-4 border border-green-200 shadow-sm">' +
                '<p class="text-3xl font-bold text-green-600">' + okCount + '</p>' +
                '<p class="text-xs text-green-500 uppercase tracking-wider mt-1">✅ Верных</p>' +
            '</div>' +
            '<div class="bg-gray-50 rounded-xl p-4 border border-gray-200 shadow-sm opacity-70">' +
                '<p class="text-3xl font-bold text-gray-500">' + skipCount + '</p>' +
                '<p class="text-xs text-gray-400 uppercase tracking-wider mt-1">⏭️ Пропущено</p>' +
            '</div>';
    } else {
        dropZone.classList.remove('hidden');
        cardsContainer.innerHTML = 
            '<div class="col-span-full text-center py-10">' +
                '<p class="text-gray-500 font-medium">Данные для обработки не найдены</p>' +
                '<p class="text-gray-400 text-sm mt-2">Проверьте, что файл содержит данные в правильном формате</p>' +
            '</div>';
    }
}
</script>

</body>
</html>
